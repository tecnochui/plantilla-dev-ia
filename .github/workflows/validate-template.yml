# validate-template.yml — Valida la integridad del repositorio plantilla.
# Se ejecuta en el propio repo plantilla, no en los proyectos generados.
# Propósito: asegurar que la plantilla está completa y funcional antes de publicar cambios.

name: Validate Template

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # 1. Validar estructura de archivos y directorios
  # ──────────────────────────────────────────────
  validate-structure:
    name: Validate Structure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Verify required files exist
        run: |
          echo "🔍 Verificando archivos requeridos..."

          # Archivos de la raíz del repo
          ROOT_FILES=(
            "README.md"
            "README.es.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "CONTRIBUTING.es.md"
            "scripts/init-project.sh"
            "scripts/README.md"
            "scripts/README.es.md"
          )

          # Documentación del repo — Español
          DOCS_FILES_ES=(
            "docs/es/ARQUITECTURA.md"
            "docs/es/FLUJO_DE_TRABAJO.md"
            "docs/es/HERRAMIENTAS.md"
            "docs/es/HERRAMIENTAS_SEGURIDAD.md"
            "docs/es/MODELOS_IA.md"
            "docs/es/SEGURIDAD.md"
            "docs/es/WORKFLOWS.md"
            "docs/es/GITHUB_SECRETS.md"
          )

          # Documentación del repo — Inglés
          DOCS_FILES_EN=(
            "docs/en/ARCHITECTURE.md"
            "docs/en/WORKFLOW.md"
            "docs/en/TOOLS.md"
            "docs/en/SECURITY_TOOLS.md"
            "docs/en/AI_MODELS.md"
            "docs/en/SECURITY.md"
            "docs/en/WORKFLOWS.md"
            "docs/en/GITHUB_SECRETS.md"
          )

          # Prompts — Español
          PROMPTS_FILES_ES=(
            "docs/es/prompts/README.md"
            "docs/es/prompts/01-PRD-SRD.md"
            "docs/es/prompts/02-SRS.md"
            "docs/es/prompts/03-Propuesta-Tecnica.md"
            "docs/es/prompts/04-SSD-TDD.md"
            "docs/es/prompts/05-Mapeo-NIST-OWASP.md"
            "docs/es/prompts/06-Estrategia-Respaldos.md"
            "docs/es/prompts/07-Plan-Pruebas.md"
            "docs/es/prompts/08-Registro-Forense.md"
          )

          # Prompts — Inglés
          PROMPTS_FILES_EN=(
            "docs/en/prompts/README.md"
            "docs/en/prompts/01-PRD-SRD.md"
            "docs/en/prompts/02-SRS.md"
            "docs/en/prompts/03-Technical-Proposal.md"
            "docs/en/prompts/04-SSD-TDD.md"
            "docs/en/prompts/05-NIST-OWASP-Mapping.md"
            "docs/en/prompts/06-Backup-Strategy.md"
            "docs/en/prompts/07-Test-Plan.md"
            "docs/en/prompts/08-Forensic-Record.md"
          )

          # Archivos del template (lo que se copia a cada proyecto nuevo)
          TEMPLATE_FILES=(
            "template/AGENTS.md"
            "template/AGENTS.en.md"
            "template/CLAUDE.md"
            "template/GEMINI.md"
            "template/Makefile"
            "template/setup.sh"
            "template/cliff.toml"
            "template/commitlint.config.js"
            "template/codecov.yml"
            "template/.env.example"
            "template/.eslintrc-security.js"
            "template/.gitleaks.toml"
            "template/.secrets.baseline"
            "template/.gitignore"
            "template/package.json"
            "template/requirements.txt"
            "template/.husky/pre-commit"
            "template/.husky/commit-msg"
            "template/.github/workflows/tests.yml"
            "template/.github/workflows/changelog.yml"
            "template/.github/workflows/commitlint.yml"
            "template/.github/workflows/sast.yml"
            "template/.github/workflows/sca.yml"
            "template/.github/workflows/secrets.yml"
            "template/.github/workflows/dast.yml"
          )

          # Placeholders ES en template/docs/es/
          TEMPLATE_DOCS_ES=(
            "template/docs/es/PRD-SRD.md"
            "template/docs/es/SRS.md"
            "template/docs/es/Propuesta_Tecnica.md"
            "template/docs/es/SSD-TDD.md"
            "template/docs/es/Mapeo_NIST_OWASP.md"
            "template/docs/es/Estrategia_Respaldos.md"
            "template/docs/es/Plan_Pruebas.md"
            "template/docs/es/REGISTRO_FORENSE.md"
          )

          # Placeholders EN en template/docs/en/
          TEMPLATE_DOCS_EN=(
            "template/docs/en/PRD-SRD.md"
            "template/docs/en/SRS.md"
            "template/docs/en/Technical_Proposal.md"
            "template/docs/en/SSD-TDD.md"
            "template/docs/en/NIST_OWASP_Mapping.md"
            "template/docs/en/Backup_Strategy.md"
            "template/docs/en/Test_Plan.md"
            "template/docs/en/FORENSIC_RECORD.md"
          )

          # Archivos comunes del template/docs/
          TEMPLATE_DOCS_COMMON=(
            "template/docs/deploy.yml.example"
          )

          MISSING=0

          check_files() {
            local label="$1"
            shift
            for file in "$@"; do
              if [ ! -f "$file" ]; then
                echo "❌ FALTA ($label): $file"
                MISSING=$((MISSING + 1))
              else
                echo "✅ OK ($label): $file"
              fi
            done
          }

          check_files "ROOT"        "${ROOT_FILES[@]}"
          check_files "DOCS-ES"     "${DOCS_FILES_ES[@]}"
          check_files "DOCS-EN"     "${DOCS_FILES_EN[@]}"
          check_files "PROMPTS-ES"  "${PROMPTS_FILES_ES[@]}"
          check_files "PROMPTS-EN"  "${PROMPTS_FILES_EN[@]}"
          check_files "TEMPLATE"    "${TEMPLATE_FILES[@]}"
          check_files "T-DOCS-ES"   "${TEMPLATE_DOCS_ES[@]}"
          check_files "T-DOCS-EN"   "${TEMPLATE_DOCS_EN[@]}"
          check_files "T-DOCS-COM"  "${TEMPLATE_DOCS_COMMON[@]}"

          if [ "$MISSING" -gt 0 ]; then
            echo ""
            echo "❌ Faltan $MISSING archivo(s)."
            exit 1
          fi

          echo ""
          echo "✅ Todos los archivos requeridos están presentes."

      - name: Verify directory structure
        run: |
          echo "🔍 Verificando estructura de directorios..."

          REQUIRED_DIRS=(
            "docs"
            "docs/es"
            "docs/en"
            "docs/es/prompts"
            "docs/en/prompts"
            "scripts"
            "template"
            "template/.github"
            "template/.github/workflows"
            "template/.husky"
            "template/docs"
            "template/docs/es"
            "template/docs/en"
          )

          MISSING=0

          for dir in "${REQUIRED_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ FALTA: $dir"
              MISSING=$((MISSING + 1))
            else
              echo "✅ OK: $dir"
            fi
          done

          if [ "$MISSING" -gt 0 ]; then
            echo ""
            echo "❌ Faltan $MISSING directorio(s)."
            exit 1
          fi

          echo ""
          echo "✅ Todos los directorios requeridos están presentes."

  # ──────────────────────────────────────────────
  # 2. ShellCheck: validar sintaxis de scripts Bash
  # ──────────────────────────────────────────────
  lint-shell:
    name: Lint Shell Scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Run ShellCheck on scripts
        uses: essentialkaos/shellcheck-action@v1
        with:
          files: |
            scripts/init-project.sh
            template/setup.sh

      - name: Verify scripts are executable
        run: |
          echo "🔍 Verificando permisos de ejecución..."

          SCRIPTS=(
            "scripts/init-project.sh"
            "template/setup.sh"
          )

          MISSING=0

          for script in "${SCRIPTS[@]}"; do
            if [ -x "$script" ]; then
              echo "✅ OK (ejecutable): $script"
            else
              echo "❌ NO ejecutable: $script"
              echo "   Ejecuta: chmod +x $script"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ "$MISSING" -gt 0 ]; then
            exit 1
          fi

  # ──────────────────────────────────────────────
  # 3. Validar archivos de configuración (YAML, TOML, JSON)
  # ──────────────────────────────────────────────
  validate-configs:
    name: Validate Config Files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Validate YAML files
        run: |
          echo "🔍 Validando archivos YAML..."

          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          YAML_FILES=$(find . -type f \( -name "*.yml" -o -name "*.yaml" \) \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -not -path "./venv/*")

          VALID=0
          INVALID=0

          for file in $YAML_FILES; do
            if yq eval '.' "$file" > /dev/null 2>&1; then
              echo "✅ OK: $file"
              VALID=$((VALID + 1))
            else
              echo "❌ INVÁLIDO: $file"
              INVALID=$((INVALID + 1))
            fi
          done

          echo ""
          echo "Archivos YAML válidos: $VALID"
          echo "Archivos YAML inválidos: $INVALID"

          if [ "$INVALID" -gt 0 ]; then
            exit 1
          fi

      - name: Validate TOML files
        run: |
          echo "🔍 Validando archivos TOML..."

          curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz \
            | gunzip - > /tmp/taplo
          chmod +x /tmp/taplo
          sudo mv /tmp/taplo /usr/local/bin/taplo

          TOML_FILES=$(find . -type f -name "*.toml" \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -not -path "./venv/*")

          VALID=0
          INVALID=0

          for file in $TOML_FILES; do
            if taplo check "$file" > /dev/null 2>&1; then
              echo "✅ OK: $file"
              VALID=$((VALID + 1))
            else
              echo "❌ INVÁLIDO: $file"
              INVALID=$((INVALID + 1))
            fi
          done

          echo ""
          echo "Archivos TOML válidos: $VALID"
          echo "Archivos TOML inválidos: $INVALID"

          if [ "$INVALID" -gt 0 ]; then
            exit 1
          fi

      - name: Validate JSON files
        run: |
          echo "🔍 Validando archivos JSON..."

          JSON_FILES=$(find . -type f -name "*.json" \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -not -path "./venv/*")

          VALID=0
          INVALID=0

          for file in $JSON_FILES; do
            if python3 -m json.tool "$file" > /dev/null 2>&1; then
              echo "✅ OK: $file"
              VALID=$((VALID + 1))
            else
              echo "❌ INVÁLIDO: $file"
              INVALID=$((INVALID + 1))
            fi
          done

          echo ""
          echo "Archivos JSON válidos: $VALID"
          echo "Archivos JSON inválidos: $INVALID"

          if [ "$INVALID" -gt 0 ]; then
            exit 1
          fi

  # ──────────────────────────────────────────────
  # 4. Probar que init-project.sh genera un proyecto correcto
  # ──────────────────────────────────────────────
  test-template:
    name: Test Template Generation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Create test project (Spanish)
        run: |
          echo "🔍 Probando creación de proyecto de prueba (español)..."
          chmod +x scripts/init-project.sh
          ./scripts/init-project.sh test-project-es --language es --no-git --yes
          echo "✅ Proyecto de prueba (ES) creado."

      - name: Verify generated project structure (Spanish)
        run: |
          echo "🔍 Verificando estructura del proyecto generado (ES)..."

          cd test-project-es

          CRITICAL_FILES=(
            "AGENTS.md"
            "CLAUDE.md"
            "GEMINI.md"
            "Makefile"
            "setup.sh"
            "cliff.toml"
            "commitlint.config.js"
            "codecov.yml"
            ".env.example"
            ".eslintrc-security.js"
            ".gitleaks.toml"
            ".secrets.baseline"
            ".gitignore"
            ".project-language"
            "package.json"
            "requirements.txt"
            ".husky/pre-commit"
            ".husky/commit-msg"
            ".github/workflows/tests.yml"
            ".github/workflows/sast.yml"
            ".github/workflows/sca.yml"
            ".github/workflows/secrets.yml"
            ".github/workflows/changelog.yml"
            ".github/workflows/commitlint.yml"
            ".github/workflows/dast.yml"
            "docs/PRD-SRD.md"
            "docs/SRS.md"
            "docs/Propuesta_Tecnica.md"
            "docs/SSD-TDD.md"
            "docs/Mapeo_NIST_OWASP.md"
            "docs/Estrategia_Respaldos.md"
            "docs/Plan_Pruebas.md"
            "docs/REGISTRO_FORENSE.md"
            "docs/WORKFLOWS.md"
            "docs/HERRAMIENTAS_SEGURIDAD.md"
            "docs/GITHUB_SECRETS.md"
            "docs/deploy.yml.example"
            "docs/prompts/README.md"
            "docs/prompts/01-PRD-SRD.md"
            "docs/prompts/02-SRS.md"
            "docs/prompts/03-Propuesta-Tecnica.md"
            "docs/prompts/04-SSD-TDD.md"
            "docs/prompts/05-Mapeo-NIST-OWASP.md"
            "docs/prompts/06-Estrategia-Respaldos.md"
            "docs/prompts/07-Plan-Pruebas.md"
            "docs/prompts/08-Registro-Forense.md"
          )

          MISSING=0

          for file in "${CRITICAL_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ FALTA en proyecto ES: $file"
              MISSING=$((MISSING + 1))
            fi
          done

          CRITICAL_DIRS=(
            "src"
            "tests"
            "scripts"
            "config"
            "docs"
            "docs/prompts"
            ".github/workflows"
            ".husky"
          )

          for dir in "${CRITICAL_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ FALTA directorio en proyecto ES: $dir"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ "$MISSING" -gt 0 ]; then
            echo ""
            echo "❌ Faltan $MISSING elementos en el proyecto ES."
            exit 1
          fi

          # Verificar idioma
          LANG=$(cat .project-language)
          if [ "$LANG" != "es" ]; then
            echo "❌ .project-language esperado 'es', encontrado '$LANG'"
            exit 1
          fi

          echo ""
          echo "✅ El proyecto ES tiene la estructura correcta."

      - name: Verify prompts were copied (Spanish)
        run: |
          cd test-project-es
          PROMPTS_COUNT=$(find docs/prompts -maxdepth 1 -type f -name "*.md" | wc -l)
          if [ "$PROMPTS_COUNT" -ge 9 ]; then
            echo "✅ Prompts ES copiados: $PROMPTS_COUNT archivos."
          else
            echo "❌ Solo $PROMPTS_COUNT archivos en docs/prompts/. Se esperaban al menos 9."
            exit 1
          fi

      - name: Cleanup Spanish project
        if: always()
        run: rm -rf test-project-es

      - name: Create test project (English)
        run: |
          echo "🔍 Probando creación de proyecto de prueba (inglés)..."
          ./scripts/init-project.sh test-project-en --language en --no-git --yes
          echo "✅ Proyecto de prueba (EN) creado."

      - name: Verify generated project structure (English)
        run: |
          echo "🔍 Verificando estructura del proyecto generado (EN)..."

          cd test-project-en

          CRITICAL_FILES=(
            "AGENTS.md"
            "CLAUDE.md"
            "GEMINI.md"
            "Makefile"
            "setup.sh"
            ".project-language"
            "docs/PRD-SRD.md"
            "docs/SRS.md"
            "docs/Technical_Proposal.md"
            "docs/SSD-TDD.md"
            "docs/NIST_OWASP_Mapping.md"
            "docs/Backup_Strategy.md"
            "docs/Test_Plan.md"
            "docs/FORENSIC_RECORD.md"
            "docs/WORKFLOWS.md"
            "docs/SECURITY_TOOLS.md"
            "docs/GITHUB_SECRETS.md"
            "docs/prompts/README.md"
            "docs/prompts/01-PRD-SRD.md"
            "docs/prompts/02-SRS.md"
            "docs/prompts/03-Technical-Proposal.md"
            "docs/prompts/04-SSD-TDD.md"
            "docs/prompts/05-NIST-OWASP-Mapping.md"
            "docs/prompts/06-Backup-Strategy.md"
            "docs/prompts/07-Test-Plan.md"
            "docs/prompts/08-Forensic-Record.md"
          )

          MISSING=0

          for file in "${CRITICAL_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ FALTA en proyecto EN: $file"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ "$MISSING" -gt 0 ]; then
            echo ""
            echo "❌ Faltan $MISSING elementos en el proyecto EN."
            exit 1
          fi

          # Verificar idioma
          LANG=$(cat .project-language)
          if [ "$LANG" != "en" ]; then
            echo "❌ .project-language esperado 'en', encontrado '$LANG'"
            exit 1
          fi

          echo ""
          echo "✅ El proyecto EN tiene la estructura correcta."

      - name: Verify prompts were copied (English)
        run: |
          cd test-project-en
          PROMPTS_COUNT=$(find docs/prompts -maxdepth 1 -type f -name "*.md" | wc -l)
          if [ "$PROMPTS_COUNT" -ge 9 ]; then
            echo "✅ Prompts EN copiados: $PROMPTS_COUNT archivos."
          else
            echo "❌ Solo $PROMPTS_COUNT archivos en docs/prompts/. Se esperaban al menos 9."
            exit 1
          fi

      - name: Cleanup English project
        if: always()
        run: rm -rf test-project-en

  # ──────────────────────────────────────────────
  # 5. Markdown Lint (opcional, informativo)
  # ──────────────────────────────────────────────
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-24.04
    continue-on-error: true  # Informativo, no bloquea
    steps:
      - uses: actions/checkout@v5

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !node_modules/**
            !venv/**